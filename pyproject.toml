[project]
name = "voxlabs"
version = "3.0.0"
description = "VoxLabs - local-first desktop voice cloning, TTS and audio production"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pyside6>=6.8",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7",
    "numpy>=1.26",
    "scipy>=1.13",
    "soundfile>=0.12.1",
    "librosa>=0.10.2",
    "gtts>=2.5.0",
    "edge-tts>=6.1.0",
    "mcp>=2.2",
]

[project.optional-dependencies]
piper = ["piper-tts>=1.2"]
kokoro = [
    "kokoro>=0.9.4",
    # misaki (Kokoro's phonemizer) downloads this spaCy model on first use when it is missing;
    # installing it here keeps generation offline.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
xtts = ["coqui-tts>=0.24"]
f5 = ["f5-tts>=1.0"]
chatterbox = ["chatterbox-tts>=0.1"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
    "pytest-qt>=4.4",
    "pyinstaller>=6.4",
]

[tool.uv]
package = false
conflicts = [
    [{ extra = "xtts" }, { extra = "f5" }, { extra = "chatterbox" }],
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
qt_api = "pyside6"
# Keep the suite warning-free: a new deprecation fails the run instead of scrolling past.
filterwarnings = ["error"]

[tool.pyright]
include = ["app", "tests"]
venvPath = "."
venv = ".venv"
