[project]
name = "voxlabs"
version = "3.0.0"
description = "VoxLabs - local-first desktop voice cloning, TTS and audio production"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pyside6>=6.8",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7",
    "numpy>=1.26",
    "scipy>=1.13",
    "soundfile>=0.12.1",
    "librosa>=0.10.2",
    "gtts>=2.5.0",
    "edge-tts>=6.1.0",
    "mcp>=1.12",
]

[project.optional-dependencies]
piper = ["piper-tts>=1.2"]
xtts = ["coqui-tts>=0.24"]
f5 = ["f5-tts>=1.0"]
chatterbox = ["chatterbox-tts>=0.1"]

[project.scripts]
voxlabs = "app.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
    "pytest-qt>=4.4",
    "pyinstaller>=6.4",
]

[tool.uv]
package = false
conflicts = [
    [{ extra = "xtts" }, { extra = "f5" }, { extra = "chatterbox" }],
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
qt_api = "pyside6"

[tool.pyright]
include = ["app", "tests"]
venvPath = "."
venv = ".venv"
