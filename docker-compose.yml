services:
  api:
    build: .
    container_name: voxlabs-api
    # Published on the host's loopback only; add a token before exposing it wider.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - VOXLABS_API_TOKEN=${VOXLABS_API_TOKEN:-}
    volumes:
      - voxlabs_data:/data
    restart: unless-stopped

volumes:
  voxlabs_data:
