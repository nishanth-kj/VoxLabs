name: Desktop app

# Builds the VoxLabs desktop app for Windows, macOS and Linux with `uv run build` (scripts/build.py):
#   Windows  .zip (portable), -Setup.exe (Inno Setup), .msi (WiX)
#   macOS    .dmg, .pkg
#   Linux    .tar.gz (portable), .deb, .rpm
# Every run uploads them as workflow artifacts; pushing a `v*` tag also publishes them on a GitHub
# release, which the landing page's download buttons link to.

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - "scripts/build.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-22.04  # the oldest glibc we support, so the build runs on newer distros too
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt and audio libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libglib2.0-0 libpulse0 libsndfile1 rpm

      # Setup.exe needs Inno Setup, the .msi needs WiX (a .NET tool; .NET is on the runner). macOS has pkgbuild.
      - name: Install installer tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          dotnet tool install --global wix --version 5.0.2
          Join-Path $env:USERPROFILE ".dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # Same command as a local build: PyInstaller bundle, a --self-test launch, then the packages.
      - name: Build, self-test, package and make installers
        run: uv run build --require-installers

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: VoxLabs-${{ matrix.name }}
          path: dist/VoxLabs-*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
