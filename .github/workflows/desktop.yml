name: Desktop app

# Builds the VoxLabs desktop app for Windows, macOS and Linux with PyInstaller (scripts/build.py).
# Every run uploads the packages as workflow artifacts; pushing a `v*` tag also publishes them
# on a GitHub release, which the landing page's download buttons link to.

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - "scripts/build.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            asset: VoxLabs-Windows-x64.zip
          - name: macOS
            os: macos-latest
            asset: VoxLabs-macOS-arm64.dmg
          - name: Linux
            os: ubuntu-22.04  # the oldest glibc we support, so the build runs on newer distros too
            asset: VoxLabs-Linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt and audio libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libglib2.0-0 libpulse0 libsndfile1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build with PyInstaller
        run: uv run python scripts/build.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/VoxLabs -DestinationPath "${{ matrix.asset }}"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg
          cp -R dist/VoxLabs.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname VoxLabs -srcfolder dmg -ov -format UDZO "${{ matrix.asset }}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.asset }}" -C dist VoxLabs

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
